name: Verify official download on Android 8 and 17

on:
  workflow_dispatch:
    inputs:
      archive_sha256:
        description: SHA-256 of the exact draft release archive
        required: true
        type: string
      android17_only:
        description: Recheck Android 17 after Android 8 has passed
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fetch:
    name: Read the unpublished candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # GitHub requires push access to read draft releases. This short job only
    # downloads the fixed candidate; emulator jobs retain read-only access.
    permissions:
      contents: write
    steps:
      - name: Retrieve the exact draft asset
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.archive_sha256 }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{64}$ ]]
          gh release download v0.6.0 --repo "$GITHUB_REPOSITORY" --pattern 'Linkloft-0.6.0-Android-8-plus.apks' --dir candidate
          printf '%s  %s\n' "$EXPECTED_SHA" 'candidate/Linkloft-0.6.0-Android-8-plus.apks' | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: exact-unpublished-candidate
          path: candidate/Linkloft-0.6.0-Android-8-plus.apks
          retention-days: 1
  verify:
    name: Fresh install on Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    needs: fetch
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(inputs.android17_only && '["37"]' || '["26","37"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: exact-unpublished-candidate
          path: candidate
      - name: Check candidate checksum and prepare Android tools
        env:
          EXPECTED_SHA: ${{ inputs.archive_sha256 }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$EXPECTED_SHA" 'candidate/Linkloft-0.6.0-Android-8-plus.apks' | sha256sum --check
          sdkmanager 'build-tools;36.0.0'
          sudo chown "$USER" /dev/kvm
      - name: Check original APK signatures and fresh external installation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api == '37' && '37.0' || matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: ${{ matrix.api == '37' && '4096M' || '2048M' }}
          profile: ${{ matrix.api == '37' && 'pixel_6' || '' }}
          disk-size: 6144M
          emulator-options: -no-window -gpu ${{ matrix.api == '37' && 'swiftshader' || 'swiftshader_indirect' }} -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: python3 tools/verify_download.py --api '${{ matrix.api }}' --archive candidate/Linkloft-0.6.0-Android-8-plus.apks
      - name: Save installation result and app screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-install-api-${{ matrix.api }}
          path: verification/
          if-no-files-found: ignore
